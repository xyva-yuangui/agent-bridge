name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .
      - run: python scripts/bootstrap_wheel.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests
      - name: Build distributions
        run: python -m build
      - name: Verify installed entry points outside source imports
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          bridge --version
          bridge --help
          bridge doctor || test $? -eq 0
          bridge setup --dry-run --auto

  windows-notifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install built package before Python tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python scripts/bootstrap_wheel.py --check
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Locked Rust release build and size gate
        shell: pwsh
        run: |
          cargo build --manifest-path native/windows-notify/Cargo.toml --locked --release
          ./native/windows-notify/scripts/verify-release.ps1
          $helper = Get-Item native/windows-notify/target/release/agent-bridge-windows-notify.exe
          if ($helper.Length -gt 5MB) { throw "Windows notifier exceeds 5 MiB" }
      - name: Windows protocol and installer tests from installed package
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          python -m unittest tests.platform.test_windows_notify_protocol tests.test_installers -v

  macos-notifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install built package before Python tests
        run: |
          python -m pip install --upgrade pip build
          python scripts/bootstrap_wheel.py --check
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Universal2 Swift helper build and size gate
        run: native/macos-notify/scripts/build-universal2.sh
      - name: Verify universal architectures
        run: |
          file native/macos-notify/dist/AgentBridgeNotifier.app/Contents/MacOS/AgentBridgeNotifier
          test "$(stat -f%z native/macos-notify/dist/AgentBridgeNotifier.app/Contents/MacOS/AgentBridgeNotifier)" -le 5242880
      - name: macOS source and protocol tests from installed package
        run: |
          unset PYTHONPATH
          python -m unittest tests.platform.test_macos_notify_protocol tests.platform.test_macos_notify_source -v
