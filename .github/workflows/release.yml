name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to release
        required: true
        type: string
      sign:
        description: Sign and notarize a manual release (tag releases always sign)
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      signing: ${{ steps.release.outputs.signing }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - id: release
        name: Require an annotated, version-matched release tag
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          MANUAL_SIGN: ${{ inputs.sign }}
          AGENT_BRIDGE_SIGNING_P12_B64: ${{ secrets.AGENT_BRIDGE_SIGNING_P12_B64 }}
          AGENT_BRIDGE_SIGNING_P12_PASSWORD: ${{ secrets.AGENT_BRIDGE_SIGNING_P12_PASSWORD }}
          AGENT_BRIDGE_CODESIGN_IDENTITY: ${{ secrets.AGENT_BRIDGE_CODESIGN_IDENTITY }}
          AGENT_BRIDGE_CODESIGN_TEAM_ID: ${{ secrets.AGENT_BRIDGE_CODESIGN_TEAM_ID }}
          AGENT_BRIDGE_APPLE_ID: ${{ secrets.AGENT_BRIDGE_APPLE_ID }}
          AGENT_BRIDGE_APP_SPECIFIC_PASSWORD: ${{ secrets.AGENT_BRIDGE_APP_SPECIFIC_PASSWORD }}
          AGENT_BRIDGE_APPLE_TEAM_ID: ${{ secrets.AGENT_BRIDGE_APPLE_TEAM_ID }}
          AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64: ${{ secrets.AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64 }}
          AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REQUESTED_TAG"
          test "$(git cat-file -t "$REQUESTED_TAG")" = tag
          git describe --exact-match --tags HEAD | grep -Fx "$REQUESTED_TAG"
          test "${REQUESTED_TAG#v}" = "$(python -c 'from pathlib import Path; import re; print(re.search(r"version = \"([^\"]+)\"", Path("pyproject.toml").read_text()).group(1))')"
          python scripts/bootstrap_wheel.py --check
          if [[ "$GITHUB_REF_TYPE" == tag || "$MANUAL_SIGN" == true ]]; then
            test -n "$AGENT_BRIDGE_SIGNING_P12_B64"
            test -n "$AGENT_BRIDGE_SIGNING_P12_PASSWORD"
            test -n "$AGENT_BRIDGE_CODESIGN_IDENTITY"
            test -n "$AGENT_BRIDGE_CODESIGN_TEAM_ID"
            test -n "$AGENT_BRIDGE_APPLE_ID"
            test -n "$AGENT_BRIDGE_APP_SPECIFIC_PASSWORD"
            test -n "$AGENT_BRIDGE_APPLE_TEAM_ID"
            test -n "$AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64"
            test -n "$AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD"
            signing=true
          else
            signing=false
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      REQUESTED_TAG: ${{ needs.validate.outputs.tag }}
      SIGNING_REQUIRED: ${{ needs.validate.outputs.signing }}
      AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64: ${{ secrets.AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64 }}
      AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build and verify the locked Windows helper
        shell: pwsh
        run: |
          ./native/windows-notify/scripts/verify-release.ps1
          $helper = Resolve-Path native/windows-notify/dist/windows-x86_64/agent-bridge-windows-notify.exe
          if ($env:SIGNING_REQUIRED -eq 'true') {
            Write-Output "::add-mask::$env:AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64"
            Write-Output "::add-mask::$env:AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD"
            $certificate = Join-Path $env:RUNNER_TEMP 'agent-bridge-windows-signing.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:AGENT_BRIDGE_WINDOWS_SIGNING_PFX_B64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe is unavailable' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:AGENT_BRIDGE_WINDOWS_SIGNING_PFX_PASSWORD $helper
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            & $signtool.FullName verify /pa /all $helper
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
            if ((Get-AuthenticodeSignature $helper).Status -ne 'Valid') { throw 'Authenticode status is not Valid' }
            Remove-Item -LiteralPath $certificate -Force
          } else {
            if ((Get-AuthenticodeSignature $helper).Status -eq 'Valid') { throw 'manual unsigned build unexpectedly used a signing identity' }
            Write-Warning 'UNSIGNED MANUAL ARTIFACT: explicit workflow_dispatch sign=false'
          }
          Copy-Item native/windows-notify/dist/windows-x86_64/agent-bridge-windows-notify.exe src/agent_bridge/native/windows-x86_64/agent-bridge-windows-notify.exe -Force
          if ((Get-FileHash native/windows-notify/dist/windows-x86_64/agent-bridge-windows-notify.exe).Hash -ne (Get-FileHash src/agent_bridge/native/windows-x86_64/agent-bridge-windows-notify.exe).Hash) { throw 'staged helper differs from verified helper' }
          New-Item -ItemType Directory -Force release-components/windows-x86_64 | Out-Null
          Copy-Item native/windows-notify/dist/windows-x86_64/agent-bridge-windows-notify.exe release-components/windows-x86_64/
          python scripts/bootstrap_wheel.py --write
          python scripts/bootstrap_wheel.py --check
          New-Item -ItemType Directory -Force release-components/bootstrap | Out-Null
          Copy-Item bootstrap/* release-components/bootstrap/
      - name: Remove temporary Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'agent-bridge-windows-signing.pfx') -Force -ErrorAction SilentlyContinue
      - name: Build and exercise the packaged Windows wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build
          New-Item -ItemType Directory -Force release | Out-Null
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          $platformWheel = Join-Path release ($wheel.Name -replace '-py3-none-any\.whl$', '-py3-none-win_amd64.whl')
          python scripts/retag_wheel.py $wheel.FullName $platformWheel --tag py3-none-win_amd64
          python -m venv .release-venv
          .\.release-venv\Scripts\python -m pip install --force-reinstall --no-deps $platformWheel
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          .\.release-venv\Scripts\bridge --version
          .\.release-venv\Scripts\bridge setup --dry-run --auto
          Copy-Item install.ps1,README.md,LICENSE release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-windows
          path: |
            release/*
            release-components/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      REQUESTED_TAG: ${{ needs.validate.outputs.tag }}
      SIGNING_REQUIRED: ${{ needs.validate.outputs.signing }}
      AGENT_BRIDGE_SIGNING_P12_B64: ${{ secrets.AGENT_BRIDGE_SIGNING_P12_B64 }}
      AGENT_BRIDGE_SIGNING_P12_PASSWORD: ${{ secrets.AGENT_BRIDGE_SIGNING_P12_PASSWORD }}
      AGENT_BRIDGE_CODESIGN_IDENTITY: ${{ secrets.AGENT_BRIDGE_CODESIGN_IDENTITY }}
      AGENT_BRIDGE_CODESIGN_TEAM_ID: ${{ secrets.AGENT_BRIDGE_CODESIGN_TEAM_ID }}
      AGENT_BRIDGE_APPLE_ID: ${{ secrets.AGENT_BRIDGE_APPLE_ID }}
      AGENT_BRIDGE_APP_SPECIFIC_PASSWORD: ${{ secrets.AGENT_BRIDGE_APP_SPECIFIC_PASSWORD }}
      AGENT_BRIDGE_APPLE_TEAM_ID: ${{ secrets.AGENT_BRIDGE_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Provision ephemeral Developer ID keychain and notary profile
        if: needs.validate.outputs.signing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for secret in "$AGENT_BRIDGE_SIGNING_P12_B64" "$AGENT_BRIDGE_SIGNING_P12_PASSWORD" "$AGENT_BRIDGE_CODESIGN_IDENTITY" "$AGENT_BRIDGE_CODESIGN_TEAM_ID" "$AGENT_BRIDGE_APPLE_ID" "$AGENT_BRIDGE_APP_SPECIFIC_PASSWORD" "$AGENT_BRIDGE_APPLE_TEAM_ID"; do
            echo "::add-mask::$secret"
          done
          keychain="$RUNNER_TEMP/agent-bridge-signing.keychain-db"
          certificate="$RUNNER_TEMP/agent-bridge-developer-id.p12"
          keychain_password="$(uuidgen)"
          notary_profile="agent-bridge-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::add-mask::$keychain_password"
          CERTIFICATE_PATH="$certificate" python - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          encoded = os.environ["AGENT_BRIDGE_SIGNING_P12_B64"]
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except binascii.Error as error:
              raise SystemExit("invalid signing P12 base64") from error
          target = Path(os.environ["CERTIFICATE_PATH"])
          target.write_bytes(decoded)
          target.chmod(0o600)
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$AGENT_BRIDGE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$AGENT_BRIDGE_CODESIGN_IDENTITY" | grep -F "$AGENT_BRIDGE_CODESIGN_TEAM_ID"
          xcrun notarytool store-credentials "$notary_profile" --apple-id "$AGENT_BRIDGE_APPLE_ID" --team-id "$AGENT_BRIDGE_APPLE_TEAM_ID" --password "$AGENT_BRIDGE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          printf 'AGENT_BRIDGE_CODESIGN_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf 'AGENT_BRIDGE_NOTARY_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf 'AGENT_BRIDGE_NOTARY_PROFILE=%s\n' "$notary_profile" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify universal helper before staging
        shell: bash
        run: |
          set -euo pipefail
          native/macos-notify/scripts/build-universal2.sh
          binary=native/macos-notify/dist/AgentBridgeNotifier.app/Contents/MacOS/AgentBridgeNotifier
          test -s "$binary"
          file "$binary"
          lipo -archs "$binary" | grep -qw x86_64
          lipo -archs "$binary" | grep -qw arm64
          if [[ "$SIGNING_REQUIRED" == true ]]; then
            native/macos-notify/scripts/sign-and-notarize.sh
            codesign --verify --deep --strict native/macos-notify/dist/AgentBridgeNotifier.app
            spctl --assess --type execute --verbose=4 native/macos-notify/dist/AgentBridgeNotifier.app
          else
            echo 'UNSIGNED MANUAL ARTIFACT: explicit workflow_dispatch sign=false'
          fi
          rm -rf src/agent_bridge/native/macos-universal2
          mkdir -p src/agent_bridge/native/macos-universal2
          cp -R native/macos-notify/dist/AgentBridgeNotifier.app src/agent_bridge/native/macos-universal2/
          mkdir -p release-components/macos-universal2
          cp -R native/macos-notify/dist/AgentBridgeNotifier.app release-components/macos-universal2/
      - name: Remove ephemeral signing keychain and credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${AGENT_BRIDGE_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-generic-password -s "${AGENT_BRIDGE_NOTARY_PROFILE:-}" "$AGENT_BRIDGE_NOTARY_KEYCHAIN"
            security delete-keychain "$AGENT_BRIDGE_NOTARY_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/agent-bridge-developer-id.p12"
      - name: Build and exercise packaged macOS wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          mkdir -p release
          wheel=$(echo dist/*.whl)
          platform_wheel="release/$(basename "$wheel" | sed 's/-py3-none-any\.whl$/-py3-none-macosx_11_0_universal2.whl/')"
          python scripts/retag_wheel.py "$wheel" "$platform_wheel" --tag py3-none-macosx_11_0_universal2
          python -m venv .release-venv
          .release-venv/bin/pip install --force-reinstall --no-deps "$platform_wheel"
          unset PYTHONPATH
          .release-venv/bin/bridge --version
          .release-venv/bin/bridge setup --dry-run --auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-macos
          path: |
            release/*
            release-components/*
          if-no-files-found: error

  python:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Test and build source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          python -m venv .release-venv
          .release-venv/bin/pip install --force-reinstall --no-deps dist/*.whl
          unset PYTHONPATH
          .release-venv/bin/bridge doctor
          mkdir -p release
          cp dist/*.tar.gz release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-python
          path: release/*
          if-no-files-found: error

  aggregate:
    needs: [validate, windows, macos, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REQUESTED_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: incoming
      - name: Verify the complete signed artifact inventory and create SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find incoming -type f -exec cp {} release/ \;
          for required in '*-py3-none-win_amd64.whl' '*-py3-none-macosx_11_0_universal2.whl'; do
            test -n "$(find release -maxdepth 1 -name "$required" -print -quit)"
          done
          test -n "$(find release -name '*.tar.gz' -print -quit)"
          windows_helper="$(find incoming -type f -name agent-bridge-windows-notify.exe -print -quit)"
          macos_app="$(find incoming -type d -name AgentBridgeNotifier.app -print -quit)"
          bootstrap_metadata="$(find incoming -type f -name 'agent_bridge-*.bootstrap.json' -print -quit)"
          test -n "$windows_helper"
          test -n "$macos_app"
          test -n "$bootstrap_metadata"
          bootstrap_root="$(dirname "$bootstrap_metadata")"
          python scripts/build_portable_zip.py --source-root "$GITHUB_WORKSPACE" --version "${REQUESTED_TAG#v}" --windows-helper "$windows_helper" --macos-app "$macos_app" --bootstrap-root "$bootstrap_root" --output "release/agent-bridge-${REQUESTED_TAG#v}-portable.zip"
          python scripts/build_portable_zip.py --version "${REQUESTED_TAG#v}" --check "release/agent-bridge-${REQUESTED_TAG#v}-portable.zip"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = Path('release')
          files = sorted(path for path in release.iterdir() if path.is_file())
          artifact_hashes = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          version = os.environ['REQUESTED_TAG'].removeprefix('v')
          common = {'name': 'agent-bridge', 'version': version, 'hashes': artifact_hashes}
          (release / 'agent-bridge.spdx.json').write_text(json.dumps({'spdxVersion': 'SPDX-2.3', 'dataLicense': 'CC0-1.0', 'SPDXID': 'SPDXRef-DOCUMENT', 'name': f'agent-bridge-{version}', 'documentNamespace': f'https://agent-bridge.invalid/spdx/{version}', 'packages': [{'SPDXID': 'SPDXRef-AgentBridge', 'name': 'agent-bridge', 'versionInfo': version, 'downloadLocation': 'NOASSERTION', 'licenseConcluded': 'Apache-2.0', 'filesAnalyzed': False}], 'externalDocumentRefs': [], 'annotations': [common]}, indent=2) + '\n')
          (release / 'agent-bridge.cyclonedx.json').write_text(json.dumps({'bomFormat': 'CycloneDX', 'specVersion': '1.5', 'serialNumber': f'urn:uuid:agent-bridge-{version}', 'version': 1, 'metadata': {'component': {'type': 'application', 'name': 'agent-bridge', 'version': version}}, 'components': [{'type': 'file', 'name': name, 'hashes': [{'alg': 'SHA-256', 'content': digest}]} for name, digest in artifact_hashes.items()]}, indent=2) + '\n')
          PY
          (cd release && sha256sum * > SHA256SUMS.txt)
          (cd release && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assembled-release
          path: release/*
          if-no-files-found: error

  portable-macos-smoke:
    needs: [aggregate, validate]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      SIGNING_REQUIRED: ${{ needs.validate.outputs.signing }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assembled-release
          path: release
      - name: Extract and install the primary portable ZIP outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          zip=$(find release -name '*-portable.zip' -print -quit)
          test -n "$zip"
          root="$RUNNER_TEMP/Agent Bridge 发布 空格"
          home="$RUNNER_TEMP/agent-bridge-smoke-home"
          userbase="$RUNNER_TEMP/agent-bridge-smoke-userbase"
          mkdir -p "$root" "$home/.codex" "$home/.claude" "$home/.reasonix" "$home/.zcode/cli"
          unzip -q "$zip" -d "$root"
          printf '%s\n' '{"host":"codex","mechanisms":["mcp"]}' > "$home/.codex/agent-bridge-host.json"
          printf '%s\n' '{}' > "$home/.claude/settings.json"
          : > "$home/.reasonix/config.toml"
          printf '%s\n' '{}' > "$home/.zcode/cli/config.json"
          package=$(find "$root" -maxdepth 1 -type d -name 'agent-bridge-*' -print -quit)
          extracted_app="$package/native/macos-universal2/AgentBridgeNotifier.app"
          test -d "$extracted_app"
          verify_signed_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          }
          if [[ "$SIGNING_REQUIRED" == true ]]; then
            verify_signed_app "$extracted_app"
            extracted_requirement="$(codesign -d -r- "$extracted_app" 2>&1 | grep 'designated =>')"
            extracted_team="$(codesign -dvv "$extracted_app" 2>&1 | grep '^TeamIdentifier=')"
            extracted_bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extracted_app/Contents/Info.plist")"
          fi
          export PYTHONUSERBASE="$userbase"
          export AGENT_BRIDGE_MACOS_NOTIFY_APP="$extracted_app"
          unset PYTHONPATH
          "$package/install.sh" --auto --python python3 --install-root "$home"
          owned_app="$home/.agent-bridge/native/macos-universal2/AgentBridgeNotifier.app"
          receipt="$home/.agent-bridge/native/macos-universal2/receipt.json"
          test -d "$owned_app"
          test -f "$receipt"
          if [[ "$SIGNING_REQUIRED" == true ]]; then
            verify_signed_app "$owned_app"
            test "$extracted_requirement" = "$(codesign -d -r- "$owned_app" 2>&1 | grep 'designated =>')"
            test "$extracted_team" = "$(codesign -dvv "$owned_app" 2>&1 | grep '^TeamIdentifier=')"
            test "$extracted_bundle" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$owned_app/Contents/Info.plist")"
          fi
          python3 - "$receipt" "$owned_app" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          receipt, app = Path(sys.argv[1]), Path(sys.argv[2])
          owned = json.loads(receipt.read_text(encoding='utf-8'))
          executable = app / 'Contents' / 'MacOS' / 'AgentBridgeNotifier'
          digest = hashlib.sha256()
          for item in sorted(path for path in app.rglob('*') if path.is_file()):
              digest.update(item.relative_to(app).as_posix().encode('utf-8') + b'\0'); digest.update(item.read_bytes())
          assert owned['app_sha256'] == digest.hexdigest()
          assert owned['executable_sha256'] == hashlib.sha256(executable.read_bytes()).hexdigest()
          assert owned['app_path'] == str(app)
          PY
          smoke_status="$(python3 -m agent_bridge.cli --json setup status --home "$home")"
          if [[ "$SIGNING_REQUIRED" != true ]]; then
            printf '%s' "$smoke_status" | python3 -c 'import json,sys; value=json.load(sys.stdin); detail=value["setup"]["notifications"]["detail"]; assert "signing=unsigned" in detail and "gatekeeper=unknown" in detail'
          fi
          python3 -m agent_bridge.cli setup --repair --home "$home"
          python3 -m agent_bridge.cli uninstall --home "$home"

  portable-windows-smoke:
    needs: [aggregate, validate]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      SIGNING_REQUIRED: ${{ needs.validate.outputs.signing }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assembled-release
          path: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Extract, install, and verify the primary ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem release/*-portable.zip | Select-Object -First 1
          if (-not $zip) { throw 'portable ZIP is missing' }
          $root = Join-Path $env:RUNNER_TEMP 'Agent Bridge 发布 空格'
          $home = Join-Path $env:RUNNER_TEMP 'agent-bridge-smoke-home'
          $userbase = Join-Path $env:RUNNER_TEMP 'agent-bridge-smoke-userbase'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $root
          $package = Get-ChildItem -LiteralPath $root -Directory | Select-Object -First 1
          $extractedHelper = Join-Path $package.FullName 'native\windows-x86_64\agent-bridge-windows-notify.exe'
          $expected = if ($env:SIGNING_REQUIRED -eq 'true') { 'Valid' } else { 'NotSigned' }
          if ((Get-AuthenticodeSignature -LiteralPath $extractedHelper).Status.ToString() -ne $expected) {
            throw "extracted helper Authenticode status did not equal $expected"
          }
          New-Item -ItemType Directory -Force (Join-Path $home '.codex'),(Join-Path $home '.claude'),(Join-Path $home '.reasonix'),(Join-Path $home '.zcode\cli') | Out-Null
          '{"host":"codex","mechanisms":["mcp"]}' | Set-Content -Encoding utf8 (Join-Path $home '.codex\agent-bridge-host.json')
          '{}' | Set-Content -Encoding utf8 (Join-Path $home '.claude\settings.json')
          '' | Set-Content -Encoding utf8 (Join-Path $home '.reasonix\config.toml')
          '{}' | Set-Content -Encoding utf8 (Join-Path $home '.zcode\cli\config.json')
          $env:PYTHONUSERBASE = $userbase
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & (Join-Path $package.FullName 'install.ps1') -Auto -Python (Get-Command python).Source -InstallRoot $home
          $installedHelper = Join-Path $home '.agent-bridge\native\agent-bridge-windows-notify.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $installedHelper).Status.ToString() -ne $expected) {
            throw "installed helper Authenticode status did not equal $expected"
          }
          python -m agent_bridge.cli setup status --home $home
          python -m agent_bridge.cli setup --repair --home $home
          python -m agent_bridge.cli uninstall --home $home

  publish:
    needs: [validate, portable-macos-smoke, portable-windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      REQUESTED_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assembled-release
          path: release
      - name: Re-verify smoke-tested release inventory
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$REQUESTED_TAG" release/* \
            --verify-tag \
            --title "Agent Bridge $REQUESTED_TAG" \
            --notes 'The primary release download is the cross-platform asset ending in `-portable.zip`; wheels, sdist, checksums, and SBOMs are supplementary verification artifacts.'
